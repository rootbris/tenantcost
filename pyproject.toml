[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rootbris-tenantcost"
version = "0.1.0"
description = "从样本里推断成本归因到具体租户应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rootbris" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rootbris.github.io"
Repository = "https://github.com/rootbris/tenantcost"
Issues = "https://github.com/rootbris/tenantcost/issues"

[project.scripts]
tenantcost = "tenantcost:main"

[tool.setuptools]
py-modules = ["tenantcost"]
